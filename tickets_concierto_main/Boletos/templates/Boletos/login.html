<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Tickets Concierto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">
   <div class="card bg-secondary text-white p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-3">TicketsConcierto</h3>
      <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">Entrar</button>
     </form>
     <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'register' %}" class="text-warning">Regístrate aquí</a></p>
   </div>
</body>
</html>
