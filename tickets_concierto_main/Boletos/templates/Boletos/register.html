<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro | Tickets Concierto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card bg-secondary text-white p-4shadow" style="width: 100%; max-width: 450px;">
       <h3 class="text-center mb-3">Crear Cuenta</h3>
       <form method="POST">
           {% csrf_token %}
           {{ form.as_p }}
           <button type="submit" class="btn btn-warningw-100 fw-bold mt-2">Registrarse</button>
        </form>
        <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}" class="text-warning">Inicia sesión</a></p>
    </div>
</body>
</html>
