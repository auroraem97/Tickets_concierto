{% extends 'Boletos/base.html' %}
{% block title %}{{ titulo }} | Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-dark p-4 p-md-5 shadow">
            <h3 class="fw-bold text-info mb-4"><i class="bi bi-bookmark-plus me-2"></i>{{ titulo }}</h3>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
                {% endfor %}
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'categorias_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                    <button type="submit" class="btn btn-info fw-bold rounded-pill px-4">
                        <i class="bi bi-check-circle me-1"></i> Guardar Categoría
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
